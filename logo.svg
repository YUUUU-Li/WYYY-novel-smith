<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!--
    Fixed version: the version generated by Gemini defined .bg-card and .node-red
    in <style> but never instantiated them, so rendering it produced transparent
    background + no red node. This file adds the missing <rect> and <circle> and
    keeps the stroke geometry exactly as generated.
  -->
  <defs>
    <style>
      .bg-card { fill: #EBEAE3; }
      .stroke-char {
        stroke: #2B2C28;
        stroke-width: 30;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .node-red { fill: #9E3732; }
      .page-fold { fill: #2B2C28; }
    </style>
  </defs>

  <!-- missing in the generated file: the rounded card -->
  <rect class="bg-card" x="0" y="0" width="512" height="512" rx="112" />

  <!-- missing in the generated file: the red node (original: r 28/305 = 9.2% of width) -->
  <circle class="node-red" cx="256" cy="118" r="26" />

  <!-- “言”字第一长横 -->
  <line class="stroke-char" x1="124" y1="184" x2="388" y2="184" />

  <!-- “言”字中间折线 -->
  <path class="stroke-char" d="M 188 238 L 324 238 L 224 290 L 324 290" />

  <!-- 下方“口”字 -->
  <path class="stroke-char" d="
    M 324 340
    H 196
    A 16 16 0 0 0 180 356
    V 404
    A 16 16 0 0 0 196 420
    H 286
    L 332 374
    V 356
    A 16 16 0 0 0 316 340
    Z" />

  <!-- 书页右下折角 -->
  <path class="page-fold" d="M 286 420 L 286 384 A 10 10 0 0 1 296 374 L 332 374 Z" />
</svg>
