<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浅色纸面主题。这个声明影响浏览器原生控件（滚动条、下拉框）的配色 -->
    <meta name="color-scheme" content="light" />
    <title>吾又一言</title>
    <!-- 图标由 npm run icons 从 src-tauri/icons/ 同步过来（见 scripts/sync-web-icons.mjs）

         ?v= 这个查询串不是装饰：浏览器把 favicon 按 URL 缓存，换了图片但 URL 不变时
         它会一直用旧的那张 —— 表现就是「桌面快捷方式图标换了，可任务栏还是旧的」。
         换图标时把这个数字加一，等于换了一个新 URL，浏览器必然重新取。 -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=4" sizes="128x128" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 全站宋体做主力，等宽只留给需要对齐的数字与 ID -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
