<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浅色纸面主题。这个声明影响浏览器原生控件（滚动条、下拉框）的配色 -->
    <meta name="color-scheme" content="light" />
    <title>吾又一言</title>
    <!-- 图标由 npm run icons 从 src-tauri/icons/ 同步过来（见 scripts/sync-web-icons.mjs） -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="128x128" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 全站宋体做主力，等宽只留给需要对齐的数字与 ID -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
